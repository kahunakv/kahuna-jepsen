name: kahuna-jepsen

# Six Kahuna nodes plus a control node, all on one bridge network so the
# control node can resolve n1..n6 by name. Nodes are privileged because the
# nemesis manipulates iptables (partitions) and, optionally, the clock.
#
# Six, not five, because of the replication-factor profile: at RF 3 a six-node
# cluster stores each range on half its nodes, which is the configuration where
# placement is doing real work and where a node can be decommissioned without
# the survivors immediately being forced back into full replication. Nothing
# obliges a run to use all of them -- `--nodes n1,n2,n3,n4,n5` is still the
# five-node cluster every existing job runs against, and n6 simply idles.

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.node
  privileged: true
  # SYS_TIME is deliberately absent: a container that can call settimeofday
  # moves the *host's* clock, which on a CI runner breaks TLS validation and
  # the job agent itself. Add it via docker/compose.clock.yml only on a
  # disposable Linux box where you actually want clock faults.
  cap_add:
    - NET_ADMIN
  networks:
    - jepsen

services:
  control:
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: jepsen-control
    hostname: control
    stdin_open: true
    tty: true
    volumes:
      - ..:/jepsen
      - ./secret:/secret:ro
    ports:
      - "8080:8080"
    networks:
      - jepsen
    depends_on: [n1, n2, n3, n4, n5, n6]

  n1:
    <<: *node
    container_name: jepsen-n1
    hostname: n1

  n2:
    <<: *node
    container_name: jepsen-n2
    hostname: n2

  n3:
    <<: *node
    container_name: jepsen-n3
    hostname: n3

  n4:
    <<: *node
    container_name: jepsen-n4
    hostname: n4

  n5:
    <<: *node
    container_name: jepsen-n5
    hostname: n5

  n6:
    <<: *node
    container_name: jepsen-n6
    hostname: n6

networks:
  jepsen:
    driver: bridge
