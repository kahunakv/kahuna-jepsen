name: jepsen

# Nightly + manual dispatch. This should NOT become a per-PR gate: Jepsen runs
# are nondeterministic and a slow, contended runner manufactures indeterminate
# operations that a fast machine would not — as a required check it would go
# red for reasons unrelated to the change under review. A red run here means
# "download the artifact and go look", not "the PR is broken".
on:
  schedule:
    # 04:00 UTC nightly
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      kahuna_repo:
        description: 'Kahuna server repository'
        default: 'kahunakv/kahuna'
      kahuna_ref:
        description: 'Kahuna git ref to test'
        default: 'main'
      time_limit:
        description: 'Seconds of load per test'
        default: '180'
      rate:
        description: 'Requests/sec per client'
        default: '10'

concurrency:
  group: jepsen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Combined faults leave far more operations indeterminate (~27% :info
        # vs ~5% for a single fault), and indeterminate ops are what makes
        # Knossos's search explode. That job therefore runs a deliberately
        # cheaper-to-check history: fewer processes per key, fewer ops per key.
        include:
          - workload: register
            faults: partition
            concurrency: 9
            ops_per_key: 60
          - workload: register
            faults: kill
            concurrency: 9
            ops_per_key: 60
          # `all` is dropped here, and only here. The `kill`-only job above
          # keeps it: a full-cluster kill with no partition is the durability
          # test, and the cluster gets the whole interval to come back. Combined
          # with `partition` it is self-defeating -- restarts cost up to 8.5 s of
          # the 15 s interval, so the run spends itself on `:connection-refused`
          # and acknowledges too few writes for a `cas` to ever match. See
          # FINDINGS.md, "the `cas` starvation gate".
          - workload: register
            faults: partition,kill
            concurrency: 8
            concurrency_per_key: 2
            ops_per_key: 40
            kill_targets: one,majority
          # The lock workload's checkers are linear-time, so it needs none of
          # the register workload's search-cost tuning.
          - workload: lock
            faults: partition
            concurrency: 10
            ops_per_key: 60
          - workload: lock
            faults: partition,kill
            concurrency: 10
            ops_per_key: 60
          # Mutual-exclusion violations need the nemesis cycling faster than the
          # 10s lock lease: at the default 15s interval most leases expire in a
          # quiet window and the overlap never forms. Locally this config found
          # 4 exclusion violations in 8 runs where interval 15 found 0 in 5, so
          # without it the nightly is blind to that whole class of bug.
          #
          # Expect this job to be red roughly every other night until the
          # exclusion bug is fixed. That is the job working, not a flake --
          # see FINDINGS.md before assuming a failure here is noise.
          - workload: lock
            faults: partition
            concurrency: 10
            ops_per_key: 60
            nemesis_interval: 5
          # Elle needs >=2 CPUs or its analysis deadlocks; ubuntu-latest has 4.
          # Transactions are slower than single-key ops, so run fewer clients.
          - workload: append
            faults: partition
            concurrency: 5
            ops_per_key: 60
          - workload: append
            faults: partition,kill
            concurrency: 5
            ops_per_key: 60
          # Every client hammers ONE sequence, so ops-per-key/concurrency-per-key
          # are inert here — the workload does not use jepsen.independent. They
          # are still passed because the run step always renders them.
          - workload: sequencer
            faults: partition
            concurrency: 10
            ops_per_key: 60
          - workload: sequencer
            faults: partition,kill
            concurrency: 10
            ops_per_key: 60
          # The snapshot workload needs `revision_retention` set, and it is the
          # whole point of the job: at the server default (keep every revision
          # forever) a snapshot hold cannot be shown to have failed, because
          # history it did not protect is still readable from disk. Retention 4
          # with a 10 s cleanup sweep makes reclamation a real force — the
          # default 300 s sweep interval would not fire inside the run at all.
          #
          # The longer budget buys protected reads: the checker returns
          # :unknown below 25 of them, and pins are scarce while a routed read
          # returns no commit timestamp to pin at (see FINDINGS.md). A 180 s
          # partition,kill run cleared the floor locally with 59, but not by
          # much, and a 4-vCPU runner is slower.
          #
          # The `partition` job is the one carrying the signal; it is what found
          # the floor-boundary rewind (fixed in kahuna 65fcc70) with 64 violating
          # reads of 681 protected.
          #
          # `partition,kill` excludes the `all` kill target. A full-cluster kill
          # destroys every live snapshot hold, and re-pinning costs a leader
          # election plus a fresh write, so the run spends its budget
          # re-acquiring instead of reading retained history. The 2026-08-08
          # nightly drew `all` four times and `majority` four times in 300 s:
          # 40% of the run had no quorum, 16% had no process listening at all,
          # 147 of 2547 ops succeeded, and the checker returned :unknown at 20
          # protected reads with :max-depth 1 -- not one read got deeper than a
          # single revision below head. `one` and `majority` still take out
          # leaders without annihilating the hold registry.
          #
          # Even so this job is the marginal one: it clears the checker's
          # 25-protected-read floor by single digits when it clears it at all.
          # Read :valid? :unknown here as the config being too harsh to conclude
          # anything, not as a regression -- see FINDINGS.md.
          - workload: snapshot
            faults: partition
            concurrency: 10
            ops_per_key: 60
            time_limit: 300
            revision_retention: 4
            revision_cleanup_interval: 10
          - workload: snapshot
            faults: partition,kill
            concurrency: 10
            ops_per_key: 60
            time_limit: 300
            revision_retention: 4
            revision_cleanup_interval: 10
            kill_targets: one,majority
          # `pause` (SIGSTOP) is the fault the other jobs cannot simulate: the
          # process keeps its TCP connections and its leases but stops answering,
          # so peers see a live-but-mute node rather than a refused connection or
          # a severed link. For `lock` that is the sharpest lease test there is —
          # a paused holder cannot renew and cannot notice it lost the lock.
          - workload: lock
            faults: pause
            concurrency: 10
            ops_per_key: 60
          - workload: register
            faults: pause
            concurrency: 9
            ops_per_key: 60
          # Membership churn is far slower than the other faults: a leave waits
          # out the departing node's whole shutdown budget (~10-45 s) and a join
          # waits for a wiped node to backfill from scratch and be promoted
          # (7-47 s locally, longer on a 4-vCPU runner). One cycle therefore
          # costs 1-2 minutes, and at the default 180 s time limit this job
          # would land one cycle — or, if the cluster were slow to form, none at
          # all, which reads as a pass. Hence the explicit budget: a 900 s run
          # produced 13 complete cycles locally.
          #
          # Note this job is a *single*-fault run. Combining membership with
          # partition or kill is close to a no-op today: the nemesis only
          # removes a node from a fully-formed cluster, and a cluster missing a
          # node is not fully formed. See kahuna.nemesis.membership.
          - workload: register
            faults: membership
            concurrency: 9
            ops_per_key: 30
            time_limit: 900
            membership_interval: 60
          # ── Replication factor ────────────────────────────────────────────
          #
          # Six nodes, eight partitions, RF 3: each range lives on half the
          # cluster, so placement is doing real work and a node can leave
          # without the survivors being forced straight back into full
          # replication. Five nodes at RF 3 would be much closer to the legacy
          # mode and would hide exactly the routing this profile exists to
          # exercise -- the Jepsen client targets nodes directly, so most
          # operations land on a node that does not host the key and have to be
          # forwarded.
          #
          # `force_compaction` is not optional here even though it reads like a
          # tuning knob. Without it the PITR floor protects the last 90 minutes
          # of WAL, nothing is ever compacted inside a run, and every replica
          # added by the nemesis catches up from the log --
          # `PartitionStateTransfer` is never entered and the snapshot-seeding
          # path is untested while the job goes green. The placement checker
          # would return :unknown rather than let that pass, which is the
          # intended safety net, but the point is to actually test it.
          #
          # The budgets are long because a replica move is not instantaneous: an
          # add, a seed, a promotion that waits out the learner stable window,
          # and two more committed map changes, at one in-flight transfer per
          # range. At 180 s these jobs would land one or two moves.
          - workload: register
            faults: partition,kill,placement
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 8
            concurrency_per_key: 2
            ops_per_key: 40
            kill_targets: one,majority
            time_limit: 600
            partitions: 8
            replication_factor: 3
            force_compaction: true
          - workload: append
            faults: partition,placement
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 6
            ops_per_key: 60
            time_limit: 600
            partitions: 8
            replication_factor: 3
            force_compaction: true
          - workload: lock
            faults: partition,placement
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 10
            ops_per_key: 60
            time_limit: 600
            partitions: 8
            replication_factor: 3
            force_compaction: true
          # RF 1 is the cheapest high-signal configuration there is: with one
          # replica per range, a placement bug is data loss rather than
          # degradation, and there is no second copy to paper over a purge that
          # ran too early or a seed that arrived incomplete. It is also the
          # profile where a repair is unavoidable -- kill the node holding a
          # range and the planner has to rebuild it somewhere else from nothing.
          - workload: register
            faults: kill,placement
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 9
            ops_per_key: 40
            kill_targets: one
            time_limit: 600
            partitions: 8
            replication_factor: 1
            force_compaction: true
          # Scale-down: walk the roster from six nodes toward the replication
          # factor and back. The planner must degrade toward fuller replication
          # rather than lose ranges, and the last-voter refusal has to hold. One
          # pass costs several minutes -- a leave commits, the node is wiped, and
          # a rejoin backfills from scratch -- hence the budget.
          - workload: register
            faults: placement
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 9
            ops_per_key: 30
            time_limit: 900
            partitions: 8
            replication_factor: 3
            placement_nodes_out: 3
            placement_interval: 45
            force_compaction: true
          # Key-range routing. `key_range` registers the workload's key space
          # for key-order routing before the run starts and enables the `range`
          # fault, which forces a split every ~20 s by scanning a range for a
          # median key -- the only thing that moves a boundary inside a run,
          # since auto-split fires at 1000 sampled keys on a 60 s cadence.
          #
          # The first job is deliberately at the default replication factor: it
          # isolates the split transaction (create, quiesce, copy, cutover) from
          # replica placement, so a failure here is about ranges and not about
          # where their replicas live. Cheap, five nodes, and the one to look at
          # first when the RF 3 job below goes red.
          - workload: register
            faults: partition,kill,range
            concurrency: 9
            ops_per_key: 40
            kill_targets: one,majority
            time_limit: 600
            partitions: 3
            key_range: true
          # Scenario 8 proper: split and merge under a replication factor with
          # concurrent writers. The copy goes through the destination
          # partition's Raft log, so a kill landing right after cutover is the
          # test -- and the destination is a partition that did not exist when
          # the run started, which is what makes this different from every other
          # job in this matrix.
          - workload: register
            faults: partition,kill,placement,range
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 8
            concurrency_per_key: 2
            ops_per_key: 40
            kill_targets: one,majority
            time_limit: 900
            partitions: 8
            replication_factor: 3
            key_range: true
            force_compaction: true
          # 2PC across a boundary that moves underneath it. A transaction whose
          # micro-ops span a range being split has to see one map or the other,
          # never half of each -- the prepare is routed per key, so a cutover
          # between two prepares is the window. Elle is what would notice.
          - workload: append
            faults: partition,range
            nodes: n1,n2,n3,n4,n5,n6
            concurrency: 6
            ops_per_key: 60
            time_limit: 900
            partitions: 8
            replication_factor: 3
            key_range: true
            force_compaction: true

    env:
      KAHUNA_REPO: ${{ inputs.kahuna_repo || 'kahunakv/kahuna' }}
      KAHUNA_REF:  ${{ inputs.kahuna_ref  || 'main' }}
      TIME_LIMIT:  ${{ inputs.time_limit  || '180' }}
      RATE:        ${{ inputs.rate        || '10' }}
      # Which containers this job starts and which nodes the test runs against —
      # one value, so the two can never drift apart. The compose file defines
      # six; a job that names five leaves n6 unbuilt rather than idling.
      NODES:       ${{ matrix.nodes || 'n1,n2,n3,n4,n5' }}

    steps:
      - name: Check out test suite
        uses: actions/checkout@v5

      - name: Check out Kahuna server
        uses: actions/checkout@v5
        with:
          repository: ${{ env.KAHUNA_REPO }}
          ref: ${{ env.KAHUNA_REF }}
          path: kahuna

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven deps
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('kahuna/**/*.csproj') }}
          restore-keys: nuget-

      - name: Install plotting tools
        # jepsen.checker/perf shells out to gnuplot; without it the perf
        # checker returns :valid? :unknown and drags the whole run's verdict
        # down with it. graphviz is used by the timeline/graph renderers.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnuplot graphviz

      - name: Install Leiningen
        run: |
          sudo curl -fsSL -o /usr/local/bin/lein \
            https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
          sudo chmod +x /usr/local/bin/lein
          lein version

      - name: Build Kahuna tarball
        # linux-x64: must match the runner/container architecture, NOT a dev
        # laptop's arm64.
        run: ./scripts/build-tarball.sh "$GITHUB_WORKSPACE/kahuna" linux-x64

      - name: Generate SSH key for the nodes
        run: |
          mkdir -p docker/secret
          ssh-keygen -t ed25519 -N "" -C jepsen -f docker/secret/id_ed25519
          mkdir -p ~/.ssh
          cp docker/secret/id_ed25519 ~/.ssh/id_ed25519
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' \
            >> ~/.ssh/config

      - name: Start Kahuna nodes
        # Only the nodes this job uses — on a Linux runner the host reaches
        # container IPs directly, so Jepsen runs on the runner itself and the
        # control container is unnecessary.
        run: docker compose -f docker/compose.yml up -d --build ${NODES//,/ }

      - name: Map node names to container IPs
        run: |
          for n in ${NODES//,/ }; do
            ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "jepsen-$n")"
            echo "$ip $n" | sudo tee -a /etc/hosts
          done
          for n in ${NODES//,/ }; do
            until ssh -o ConnectTimeout=2 root@"$n" true 2>/dev/null; do sleep 1; done
            echo "$n reachable"
          done

      - name: Run ${{ matrix.workload }} / ${{ matrix.faults }} @ rf ${{ matrix.replication_factor || 0 }}, interval ${{ matrix.nemesis_interval || 15 }}
        # jepsen.cli exits non-zero when the checker returns :valid? false, so
        # no result parsing is needed here.
        #
        # The placement flags are rendered on every job. At the default
        # replication factor of 0 they are all inert — the server command line
        # gains nothing, the placement nemesis and sampler disable themselves,
        # and the placement checker makes no claim — so the legacy jobs above
        # run exactly the cluster they ran before. The same holds for
        # --range-interval, which is inert unless the `range` fault is on.
        #
        # --force-compaction and --key-range are the two exceptions: both are
        # switches, so they are present or absent rather than carrying a value.
        # --key-range is the one flag here that changes what the cluster *does*
        # rather than only what the harness does -- it registers the workload's
        # key space for key-order routing before any client starts.
        run: |
          lein with-profile +ci run test \
            --workload ${{ matrix.workload }} \
            --faults ${{ matrix.faults }} \
            --kill-targets ${{ matrix.kill_targets || 'one,majority,all' }} \
            --nodes "$NODES" \
            --time-limit ${{ matrix.time_limit || env.TIME_LIMIT }} \
            --rate "$RATE" \
            --concurrency ${{ matrix.concurrency }} \
            --concurrency-per-key ${{ matrix.concurrency_per_key || 3 }} \
            --ops-per-key ${{ matrix.ops_per_key }} \
            --nemesis-interval ${{ matrix.nemesis_interval || 15 }} \
            --membership-interval ${{ matrix.membership_interval || 60 }} \
            --revision-retention ${{ matrix.revision_retention || 0 }} \
            --revision-cleanup-interval ${{ matrix.revision_cleanup_interval || 300 }} \
            --partitions ${{ matrix.partitions || 3 }} \
            --replication-factor ${{ matrix.replication_factor || 0 }} \
            --placement-interval ${{ matrix.placement_interval || 30 }} \
            --placement-nodes-out ${{ matrix.placement_nodes_out || 1 }} \
            --range-interval ${{ matrix.range_interval || 20 }} \
            ${{ matrix.force_compaction && '--force-compaction' || '' }} \
            ${{ matrix.key_range && '--key-range' || '' }} \
            --tarball target/kahuna.tar.gz

      - name: Collect server logs
        if: always()
        run: |
          mkdir -p store/docker-logs
          for n in ${NODES//,/ }; do
            docker logs "jepsen-$n" > "store/docker-logs/$n.docker.log" 2>&1 || true
          done

      - name: Upload Jepsen store
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jepsen-${{ matrix.workload }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: store/
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml down -v || true
